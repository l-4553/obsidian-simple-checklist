name: Bump & Release

# Runs automatically on every push to main (i.e. every merged PR) and can
# also be started by hand (Actions -> "Bump & Release" -> Run workflow) to
# pick a different bump level. It bumps the version (minor by default),
# commits "Release X.Y.Z", tags, builds, and publishes the GitHub release
# with the built artifacts.
#
# The "Release X.Y.Z" commit is pushed with GITHUB_TOKEN, which does not
# trigger new workflow runs, so the workflow cannot loop on itself; the
# job-level `if` below skips release commits as an extra safeguard.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      level:
        description: Version bump level
        type: choice
        options:
          - minor
          - patch
          - major
        default: minor

# Merges landing close together release one after another, never in parallel.
concurrency:
  group: bump-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  bump-release:
    if: ${{ !startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Latest tip of the branch, not the triggering commit: a queued run
          # must build on top of the previous run's release commit.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version (package.json + manifest.json)
        id: bump
        env:
          LEVEL: ${{ inputs.level || 'minor' }}
        run: |
          VERSION=$(node -e '
            const fs = require("fs");
            const l = process.env.LEVEL || "minor";
            let [a, b, c] = require("./package.json").version.split(".").map(Number);
            if (l === "major") { a++; b = 0; c = 0; }
            else if (l === "minor") { b++; c = 0; }
            else if (l === "patch") { c++; }
            else { throw new Error("unknown bump level: " + l); }
            const nv = `${a}.${b}.${c}`;
            for (const f of ["package.json", "manifest.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = nv;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            console.error("bumped to " + nv);
            process.stdout.write(nv);
          ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json manifest.json
          git commit -m "Release $VERSION"
          git tag "$VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git push origin "refs/tags/$VERSION"

      - name: Attest build artifacts
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
